data:
  raw_path: "data/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv"
  processed_path: "data/processed/clean_churn.csv"
  test_size: 0.2
  random_state: 42

model:
  # Opciones esperadas por el ML Engineer: "RandomForest" o "SVM" (o "LogisticRegression")
  name: "RandomForest"
  output_path: "models/model.pkl"
  
  # Hiperparámetros por algoritmo
  random_forest:
    n_estimators: 100
    max_depth: 10
    random_state: 42
    
  svm:
    C: 1.0
    kernel: "rbf"
    random_state: 42

  logistic_regression:
    C: 1.0
    max_iter: 1000
    random_state: 42